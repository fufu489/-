<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="-400" x2="0" y2="430">
      <stop offset="0" stop-color="#5cb8f0"/>
      <stop offset="0.65" stop-color="#a9dcff"/>
      <stop offset="1" stop-color="#ffe9c7"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0.45" stop-color="#fff3b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e9ee"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6168"/>
      <stop offset="1" stop-color="#474a50"/>
    </linearGradient>
  </defs>

  <!-- 天空与太阳 -->
  <rect x="-4000" y="-4000" width="8800" height="4440" fill="url(#sky)"/>
  <circle cx="650" cy="95" r="90" fill="url(#sunGlow)"/>
  <circle cx="650" cy="95" r="38" fill="#ffd45e"/>

  <!-- 云 -->
  <g id="clouds"></g>

  <!-- 远山与近山 -->
  <g id="hillsFar"></g>
  <g id="hillsNear"></g>

  <!-- 地面 -->
  <rect x="-4000" y="425" width="8800" height="4000" fill="#7cbf55"/>
  <g id="fence"></g>
  <rect x="-4000" y="440" width="8800" height="58" fill="url(#road)"/>
  <rect x="-4000" y="438" width="8800" height="4" fill="#9a9ea5"/>
  <rect x="-4000" y="496" width="8800" height="4" fill="#9a9ea5"/>
  <g id="dashes"></g>
  <rect x="-4000" y="500" width="8800" height="4000" fill="#6fb24a"/>
  <g id="tufts"></g>

  <!-- 速度线 -->
  <g id="speedLines" stroke="#ffffff" stroke-linecap="round" stroke-width="3" opacity="0.8"></g>

  <!-- 阴影 -->
  <ellipse cx="400" cy="462" rx="185" ry="7" fill="#000" opacity="0.18"/>

  <!-- 远侧曲柄与腿 -->
  <line id="crankFar" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <rect id="pedalFar" width="16" height="5" rx="2" fill="#444"/>
  <g id="legFar" stroke="#d98a2a" stroke-linecap="round" fill="none">
    <line id="thighFar" stroke-width="9"/>
    <line id="shinFar" stroke-width="7"/>
    <path id="footFar" fill="#d98a2a" stroke="none"/>
  </g>

  <!-- 车轮 -->
  <g id="wheelRear"></g>
  <g id="wheelFront"></g>

  <!-- 链条 -->
  <circle cx="280" cy="390" r="8" fill="none" stroke="#777" stroke-width="3"/>
  <path id="chain" d="M280,382 L390,379 M280,398 L390,411" stroke="#666" stroke-width="2.5"
        stroke-dasharray="3 2" fill="none"/>

  <!-- 车架 -->
  <g stroke="#e63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="280" y1="390" x2="390" y2="395"/>
    <line x1="280" y1="390" x2="362" y2="300"/>
    <line x1="390" y1="395" x2="358" y2="292"/>
    <line x1="361" y1="302" x2="493" y2="288"/>
    <line x1="390" y1="395" x2="499" y2="306"/>
    <path d="M500,308 Q508,350 520,390" stroke-width="6"/>
    <line x1="490" y1="278" x2="500" y2="310" stroke-width="10"/>
  </g>
  <!-- 车把与车座 -->
  <path d="M490,280 L486,262" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <path d="M474,258 L498,262" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <path d="M358,292 L357,284" stroke="#888" stroke-width="5"/>
  <path d="M333,283 Q358,276 386,285 L381,292 Q358,289 337,291 Z" fill="#2b2b2b"/>

  <!-- 车筐和鱼 -->
  <g id="basket">
    <g id="fishTail">
      <path d="M522,268 Q526,250 518,238 L532,244 L536,232 Q540,250 534,268 Z" fill="#5aa9d6" stroke="#3a7fa8" stroke-width="1.5"/>
    </g>
    <path d="M502,268 L552,268 L546,302 L508,302 Z" fill="#c98b4a" stroke="#8d5a2b" stroke-width="2"/>
    <g stroke="#8d5a2b" stroke-width="1.5">
      <line x1="504" y1="279" x2="550" y2="279"/>
      <line x1="506" y1="290" x2="548" y2="290"/>
      <line x1="517" y1="268" x2="518" y2="302"/>
      <line x1="527" y1="268" x2="527" y2="302"/>
      <line x1="537" y1="268" x2="536" y2="302"/>
    </g>
    <line x1="500" y1="290" x2="510" y2="290" stroke="#888" stroke-width="3"/>
  </g>

  <!-- 中心齿盘 -->
  <g id="chainring">
    <circle cx="390" cy="395" r="16" fill="none" stroke="#666" stroke-width="4" stroke-dasharray="4 2.3"/>
    <circle cx="390" cy="395" r="10" fill="#999"/>
    <circle cx="390" cy="395" r="4" fill="#555"/>
  </g>

  <!-- 鹈鹕身体 -->
  <g id="pelican">
    <path d="M305,240 L262,250 L270,258 L258,266 L300,264 Z" fill="#e6ecf1" stroke="#b9c4cd" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="362" cy="242" rx="68" ry="40" transform="rotate(-16 362 242)"
             fill="url(#bodyShade)" stroke="#b9c4cd" stroke-width="2"/>
    <!-- 翅膀握住车把 -->
    <path d="M322,224 C360,198 436,212 470,246 L484,260 C452,264 398,264 350,258 C318,252 310,236 322,224 Z"
          fill="#eef2f5" stroke="#aeb9c3" stroke-width="2"/>
    <path d="M430,236 C450,244 470,252 484,260 C466,262 448,262 430,260 C440,254 438,244 430,236 Z" fill="#3d4650"/>
    <path d="M340,236 C370,228 400,232 425,244" stroke="#c4ced7" stroke-width="2" fill="none"/>
    <path d="M340,246 C370,240 400,244 420,252" stroke="#c4ced7" stroke-width="2" fill="none"/>
    <!-- 脖子 -->
    <path d="M394,218 C434,192 404,158 432,126" stroke="#b9c4cd" stroke-width="30" stroke-linecap="round" fill="none"/>
    <path d="M394,218 C434,192 404,158 432,126" stroke="#ffffff" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- 头部 -->
    <g id="head">
      <path d="M418,108 Q404,96 398,104 Q408,104 412,112 Q400,110 398,118 Q410,114 420,118 Z" fill="#f6e3a4"/>
      <circle cx="440" cy="120" r="23" fill="#ffffff" stroke="#b9c4cd" stroke-width="2"/>
      <path id="pouch" fill="#f7c46c" stroke="#de982e" stroke-width="2" stroke-linejoin="round"/>
      <path d="M454,110 C500,113 560,124 612,140 C616,146 610,152 600,149 C552,142 496,136 452,132 Z"
            fill="#f4a62a" stroke="#d98a1c" stroke-width="2" stroke-linejoin="round"/>
      <path d="M604,140 Q618,142 614,152 Q608,150 600,149 Z" fill="#d9532b"/>
      <path d="M470,120 C520,126 560,132 596,142" stroke="#d98a1c" stroke-width="1.5" fill="none"/>
      <circle cx="449" cy="114" r="6.5" fill="#cfe7f5"/>
      <circle cx="450" cy="114" r="4" fill="#1d2733"/>
      <circle cx="451.5" cy="112.5" r="1.4" fill="#ffffff"/>
    </g>
  </g>

  <!-- 近侧曲柄与腿 -->
  <line id="crankNear" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <rect id="pedalNear" width="16" height="5" rx="2" fill="#222"/>
  <g id="legNear" stroke="#f2a33a" stroke-linecap="round" fill="none">
    <line id="thighNear" stroke-width="10"/>
    <line id="shinNear" stroke-width="7.5"/>
    <path id="footNear" fill="#f2a33a" stroke="#d98a2a" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <ellipse id="drumstick" rx="13" ry="10" fill="#eef2f5" stroke="#b9c4cd" stroke-width="2"/>
</svg>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function mod(a, n) { return ((a % n) + n) % n; }

  var LEFT = -3200, RIGHT = 4000;
  var SPEED = 230;          // 地面速度（像素/秒）
  var WHEEL_R = 70;
  var GEAR = 1.9;
  var B = { x: 390, y: 395 }, CRANK = 22;
  var THIGH = 68, SHIN = 68;

  // 车轮
  function buildWheel(g, cx, cy) {
    el('circle', { cx: cx, cy: cy, r: WHEEL_R - 4, fill: 'none', stroke: '#222', 'stroke-width': 9 }, g);
    el('circle', { cx: cx, cy: cy, r: WHEEL_R - 10, fill: 'none', stroke: '#c7ccd1', 'stroke-width': 3 }, g);
    for (var i = 0; i < 18; i++) {
      var a = i / 18 * Math.PI * 2;
      el('line', {
        x1: cx, y1: cy,
        x2: cx + Math.cos(a) * (WHEEL_R - 11), y2: cy + Math.sin(a) * (WHEEL_R - 11),
        stroke: '#d9dde1', 'stroke-width': 1.3
      }, g);
    }
    el('circle', { cx: cx, cy: cy, r: 6, fill: '#888' }, g);
    el('rect', { x: cx - 2, y: cy - WHEEL_R + 2, width: 4, height: 7, fill: '#e0b040' }, g);
  }
  var wheelRear = $('wheelRear'), wheelFront = $('wheelFront');
  buildWheel(wheelRear, 280, 390);
  buildWheel(wheelFront, 520, 390);

  // 山
  function buildHills(g, base, waves, color) {
    var d = 'M' + LEFT + ',600';
    for (var x = LEFT; x <= RIGHT + 800; x += 10) {
      var y = base;
      for (var i = 0; i < waves.length; i++) {
        var w = waves[i];
        y -= w[0] * (0.5 + 0.5 * Math.sin(2 * Math.PI * w[1] * x / 800 + w[2]));
      }
      d += ' L' + x + ',' + y.toFixed(1);
    }
    d += ' L' + (RIGHT + 800) + ',600 Z';
    el('path', { d: d, fill: color }, g);
  }
  var hillsFar = $('hillsFar'), hillsNear = $('hillsNear');
  buildHills(hillsFar, 410, [[70, 1, 0.3], [30, 3, 1.7]], '#b5dc97');
  buildHills(hillsNear, 432, [[45, 2, 2.1], [18, 5, 0.6]], '#93ca6f');
  for (var i = 0; i < 18; i++) {
    var tx = LEFT + i * 400 + 120;
    var tree = el('g', {}, hillsNear);
    el('rect', { x: tx - 3, y: 384, width: 6, height: 26, fill: '#7a5532' }, tree);
    el('circle', { cx: tx, cy: 378, r: 16, fill: '#5fa845' }, tree);
    el('circle', { cx: tx - 9, cy: 388, r: 10, fill: '#5fa845' }, tree);
    el('circle', { cx: tx + 9, cy: 388, r: 10, fill: '#5fa845' }, tree);
  }

  // 栅栏
  var fence = $('fence');
  el('rect', { x: LEFT, y: 418, width: RIGHT - LEFT + 200, height: 3, fill: '#f4ead8' }, fence);
  el('rect', { x: LEFT, y: 428, width: RIGHT - LEFT + 200, height: 3, fill: '#f4ead8' }, fence);
  for (var x = LEFT; x <= RIGHT + 200; x += 50) {
    el('rect', { x: x, y: 412, width: 5, height: 27, rx: 1.5, fill: '#fbf3e4', stroke: '#d8ccb6', 'stroke-width': 1 }, fence);
  }

  // 路面虚线
  var dashes = $('dashes');
  for (var x = LEFT; x <= RIGHT + 100; x += 90) {
    el('rect', { x: x, y: 476, width: 46, height: 5, rx: 2, fill: '#f3f3f3' }, dashes);
  }

  // 草丛与小花
  var tufts = $('tufts');
  var PERIOD = 600;
  var items = [[40, 520, 0], [150, 545, 1], [260, 515, 0], [330, 560, 2], [455, 530, 1], [540, 550, 0]];
  for (var x0 = LEFT; x0 <= RIGHT + PERIOD; x0 += PERIOD) {
    items.forEach(function (it) {
      var x = x0 + it[0], y = it[1];
      if (it[2] === 0) {
        el('path', { d: 'M' + (x - 8) + ',' + y + ' L' + (x - 4) + ',' + (y - 14) + ' L' + x + ',' + y + ' L' + (x + 4) + ',' + (y - 16) + ' L' + (x + 8) + ',' + y + ' Z', fill: '#4f9a35' }, tufts);
      } else {
        var c = it[2] === 1 ? '#ffffff' : '#ffd84d';
        el('line', { x1: x, y1: y, x2: x, y2: y - 12, stroke: '#4f9a35', 'stroke-width': 2 }, tufts);
        for (var k = 0; k < 5; k++) {
          var a = k / 5 * Math.PI * 2;
          el('circle', { cx: x + Math.cos(a) * 4, cy: y - 14 + Math.sin(a) * 4, r: 3, fill: c }, tufts);
        }
        el('circle', { cx: x, cy: y - 14, r: 2.5, fill: '#f29a2e' }, tufts);
      }
    });
  }

  // 云
  var cloudsG = $('clouds');
  var CW = 3800, CL = -1600;
  var clouds = [[-200, 70, 1], [250, 40, 0.8], [520, 150, 0.6], [900, 90, 1.1], [1400, 60, 0.9], [1900, 130, 0.7], [-900, 110, 0.9]].map(function (c) {
    var g = el('g', {}, cloudsG);
    var s = c[2];
    [[0, 0, 26], [28, -12, 30], [60, 0, 24], [30, 8, 24]].forEach(function (p) {
      el('circle', { cx: p[0] * s, cy: p[1] * s, r: p[2] * s, fill: '#ffffff', opacity: 0.92 }, g);
    });
    return { g: g, x: c[0], y: c[1], speed: 12 + 10 * s };
  });

  // 速度线
  var speedG = $('speedLines');
  var speedLines = [[200, 215, 40], [175, 260, 55], [215, 300, 35], [190, 340, 45]].map(function (s, i) {
    var l = el('line', { x1: 0, y1: s[1], x2: s[2], y2: s[1] }, speedG);
    return { el: l, x: s[0], len: s[2], phase: i * 0.27 };
  });

  // 动态元素
  var chainring = $('chainring'), chain = $('chain');
  var crankNear = $('crankNear'), crankFar = $('crankFar');
  var pedalNear = $('pedalNear'), pedalFar = $('pedalFar');
  var pelican = $('pelican'), head = $('head'), pouch = $('pouch'), fishTail = $('fishTail');
  var drumstick = $('drumstick');
  var leg = {
    near: { thigh: $('thighNear'), shin: $('shinNear'), foot: $('footNear') },
    far: { thigh: $('thighFar'), shin: $('shinFar'), foot: $('footFar') }
  };

  function setLine(l, a, b) {
    l.setAttribute('x1', a.x.toFixed(2)); l.setAttribute('y1', a.y.toFixed(2));
    l.setAttribute('x2', b.x.toFixed(2)); l.setAttribute('y2', b.y.toFixed(2));
  }

  function solveLeg(parts, hip, pedal) {
    var ankle = { x: pedal.x - 2, y: pedal.y - 8 };
    var dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    var d = Math.min(Math.sqrt(dx * dx + dy * dy), THIGH + SHIN - 0.01);
    var base = Math.atan2(dy, dx);
    var bend = Math.acos((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d));
    var knee = { x: hip.x + Math.cos(base - bend) * THIGH, y: hip.y + Math.sin(base - bend) * THIGH };
    setLine(parts.thigh, hip, knee);
    setLine(parts.shin, knee, ankle);
    var px = pedal.x, py = pedal.y;
    parts.foot.setAttribute('d',
      'M' + (ankle.x - 4) + ',' + (ankle.y - 1) +
      ' L' + (px + 20) + ',' + (py - 6) +
      ' Q' + (px + 22) + ',' + (py - 1) + ' ' + (px + 16) + ',' + (py - 1) +
      ' L' + (px - 7) + ',' + (py - 1) + ' Z');
  }

  var t0 = null;
  function frame(ts) {
    if (t0 === null) t0 = ts;
    var t = (ts - t0) / 1000;
    var dist = SPEED * t;

    // 车轮与传动
    var wheelDeg = (dist / WHEEL_R) * 180 / Math.PI;
    wheelRear.setAttribute('transform', 'rotate(' + mod(wheelDeg, 360).toFixed(2) + ' 280 390)');
    wheelFront.setAttribute('transform', 'rotate(' + mod(wheelDeg, 360).toFixed(2) + ' 520 390)');
    var crank = (dist / WHEEL_R) / GEAR;
    chainring.setAttribute('transform', 'rotate(' + mod(crank * 180 / Math.PI, 360).toFixed(2) + ' 390 395)');
    chain.setAttribute('stroke-dashoffset', (-crank * 16) % 5);

    var c = Math.cos(crank), s = Math.sin(crank);
    var pN = { x: B.x + c * CRANK, y: B.y + s * CRANK };
    var pF = { x: B.x - c * CRANK, y: B.y - s * CRANK };
    setLine(crankNear, B, pN);
    setLine(crankFar, B, pF);
    pedalNear.setAttribute('x', pN.x - 8); pedalNear.setAttribute('y', pN.y - 2.5);
    pedalFar.setAttribute('x', pF.x - 8); pedalFar.setAttribute('y', pF.y - 2.5);

    // 鹈鹕
    var bob = 1.6 * Math.sin(crank * 2);
    pelican.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    var nod = 3 * Math.sin(t * 2.6) + 1.5 * Math.sin(crank * 2);
    head.setAttribute('transform', 'rotate(' + nod.toFixed(2) + ' 432 128)');
    var w = Math.sin(t * 5.2);
    pouch.setAttribute('d',
      'M455,132 C500,138 560,146 600,149 C' + (574 + w * 3) + ',' + (176 + w * 6) + ' ' +
      (512 + w * 2) + ',' + (186 + w * 7) + ' 472,166 C460,156 452,144 455,132 Z');

    var hip = { x: 372, y: 276 + bob };
    solveLeg(leg.near, hip, pN);
    solveLeg(leg.far, { x: hip.x - 4, y: hip.y - 2 }, pF);
    drumstick.setAttribute('cx', hip.x + 2);
    drumstick.setAttribute('cy', hip.y - 3);

    fishTail.setAttribute('transform', 'rotate(' + (8 * Math.sin(t * 7)).toFixed(2) + ' 528 268)');

    // 背景视差
    dashes.setAttribute('transform', 'translate(' + (-mod(dist, 90)).toFixed(2) + ' 0)');
    fence.setAttribute('transform', 'translate(' + (-mod(dist * 0.85, 50)).toFixed(2) + ' 0)');
    tufts.setAttribute('transform', 'translate(' + (-mod(dist * 1.1, PERIOD)).toFixed(2) + ' 0)');
    hillsNear.setAttribute('transform', 'translate(' + (-mod(dist * 0.3, 800)).toFixed(2) + ' 0)');
    hillsFar.setAttribute('transform', 'translate(' + (-mod(dist * 0.12, 800)).toFixed(2) + ' 0)');

    clouds.forEach(function (cl) {
      var x = CL + mod(cl.x - CL - cl.speed * t, CW);
      cl.g.setAttribute('transform', 'translate(' + x.toFixed(2) + ' ' + cl.y + ')');
    });

    speedLines.forEach(function (sl) {
      var p = mod(t * 1.6 + sl.phase, 1);
      var x = sl.x + 40 - p * 90;
      sl.el.setAttribute('x1', x.toFixed(2));
      sl.el.setAttribute('x2', (x + sl.len).toFixed(2));
      sl.el.setAttribute('opacity', (Math.sin(p * Math.PI) * 0.9).toFixed(2));
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
